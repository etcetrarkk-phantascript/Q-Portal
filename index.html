<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#5b3cc4;--pl:#f1eefc;--bd:#e4e1ee;--tx:#1b1830;--mu:#6b6785;--g:#16a34a;--r:#dc2626;--y:#fde047;--bg:#f7f6fb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 'Hind Siliguri','Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd)}
.bar{max-width:960px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:700 18px Inter,sans-serif;color:var(--p);margin-right:auto}
nav{display:flex;gap:4px;overflow-x:auto}
nav a,.lk a{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600;white-space:nowrap;font-size:14px}
nav a.on{background:var(--pl);color:var(--p)}
.lk a{padding:0;color:var(--p)}
main{max-width:960px;margin:auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 10px;font-size:16px}
.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;margin:4px 0 10px}
textarea{font:12px/1.5 ui-monospace,monospace;min-height:170px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}
label{font-size:12px;font-weight:600;color:var(--mu)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;cursor:pointer}
.btn.s{background:var(--pl);color:var(--p)}.btn.sm{padding:5px 12px;font-size:13px}.btn.ok{background:var(--g)}.btn.no{background:#eee;color:#444}
.btn:disabled{opacity:.5}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.auth{max-width:400px;margin:30px auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pl);color:var(--p);display:inline-block}
.pill.w{background:#fef3c7;color:#92400e}.pill.g{background:#dcfce7;color:#166534}
.stick{position:sticky;top:57px;z-index:15;background:var(--p);color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.stick b{font:700 18px ui-monospace,monospace}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal a{height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.pal a.d{background:var(--y);border-color:#eab308}
.q{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;break-inside:avoid}
.q.ok{border-color:#86efac}.q.bad{border-color:#fca5a5}
.qh{display:flex;gap:10px;justify-content:space-between;font-weight:600;margin-bottom:10px}
.sc{font-size:12px;white-space:nowrap;color:var(--mu)}.sc.ok{color:var(--g)}.sc.bad{color:var(--r)}
.os{display:grid;gap:7px}
.o{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff;text-align:left;font:inherit;width:100%}
.report .o{cursor:default}
.o .b{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #cfcbe0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.o.sel{border-color:var(--p);background:var(--pl)}.o.sel .b{background:var(--p);color:#fff;border-color:var(--p)}
.o.g{background:#f0fdf4;border-color:var(--g)}.o.g .b{background:var(--g);color:#fff;border-color:var(--g)}
.o.r{background:#fef2f2;border-color:var(--r)}.o.r .b{background:var(--r);color:#fff;border-color:var(--r)}
.o.y{background:#fefce8;border-color:#eab308}.o.y .b{background:var(--y);border-color:#eab308}
.sheet{background:#fff;border:2px solid var(--p);border-radius:10px;padding:18px}
.score{font:700 26px Inter,sans-serif;color:var(--p)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.frame{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1830;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;display:none;max-width:90%}
.busy{opacity:.6;pointer-events:none}
@media(min-width:640px){.os.two{grid-template-columns:1fr 1fr}}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,.noprint,#toast{display:none!important}
 main{padding:0;max-width:none}
 .sheet{border:0;padding:12px}
 .frame{display:block;position:fixed;inset:0;border:2px solid var(--p);border-radius:6px;pointer-events:none}
 .os{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header><div class="bar"><span class="logo">Φ Q-Portal</span><nav id="nav"></nav></div></header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ===== CONFIG: paste your Apps Script Web App /exec URL ===== */
const API = "";

const $ = (s) => document.querySelector(s);
const val = (id) => ($('#' + id) || {}).value || '';
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = ['ক','খ','গ','ঘ','ঙ','চ'];
const clean = (o) => String(o).replace(/^\s*\(?[a-dA-D]\)\s*/, '');
let S = { t: localStorage.getItem('qp_t'), u: JSON.parse(localStorage.getItem('qp_u') || 'null'), sets: [] };
let sel = {}, E = null, R = null, V = 'auth', timer = null;

function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t.h); t.h = setTimeout(() => t.style.display = 'none', 3800); }

async function api(a, b = {}) {
  if (!API) throw 'Set the API URL in index.html first.';
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ a, t: S.t, ...b }) });
  const j = await r.json();
  if (j.auth) logout();
  if (!j.ok) throw j.error;
  return j;
}

function logout() { S.t = null; S.u = null; localStorage.removeItem('qp_t'); localStorage.removeItem('qp_u'); E = null; clearInterval(timer); go('auth'); }

function nav() {
  const n = $('#nav');
  if (!S.u) { n.innerHTML = ''; return; }
  const t = [['home', 'Exams'], ['hist', 'History'], ...(S.u.role === 'admin' ? [['admin', 'Admin']] : [])];
  n.innerHTML = t.map(([k, l]) => `<a data-a="go" data-v="${k}" class="${V === k ? 'on' : ''}">${l}</a>`).join('') +
    `<a data-a="logout">Sign out (${esc(S.u.name.split(' ')[0])})</a>`;
}

function go(v, arg) {
  V = v; window.scrollTo(0, 0);
  ({ auth: vAuth, home: vHome, hist: vHist, admin: vAdmin, exam: vExam, report: vReport })[v](arg);
  nav();
}

/* ===== AUTH ===== */
let AU = { m: 'login', em: '' };
function vAuth(m) {
  if (typeof m === 'string') AU.m = m;
  const em = esc(AU.em);
  const F = {
    login: `<h2>Sign in</h2><p class="mu">Use your registered Gmail account.</p>
      <label>Gmail</label><input id="e" type="email" value="${em}"><label>Password</label><input id="p" type="password">
      <button class="btn" data-a="login" style="width:100%">Sign in</button>
      <p class="lk mu"><a data-a="auth" data-m="reg">Create account</a> &nbsp;·&nbsp; <a data-a="auth" data-m="forgot">Forgot password?</a></p>`,
    reg: `<h2>Register</h2><p class="mu">Gmail 2FA, then admin approval.</p>
      <label>Full name</label><input id="n"><label>Roll / College ID</label><input id="r">
      <label>Class</label><select id="c"><option>HSC</option><option>SSC</option><option>Admission</option></select>
      <label>Gmail</label><input id="e" type="email"><label>Password (6+)</label><input id="p" type="password">
      <button class="btn" data-a="register" style="width:100%">Send verification code</button>
      <p class="lk mu"><a data-a="auth" data-m="login">Back to sign in</a></p>`,
    otp: `<h2>Verify Gmail</h2><p class="mu">We sent a 6-digit code to <b>${em}</b>.</p>
      <input id="c" inputmode="numeric" maxlength="6" placeholder="123456" style="text-align:center;font-size:22px;letter-spacing:6px">
      <button class="btn" data-a="verify" style="width:100%">Verify</button>`,
    forgot: `<h2>Reset password</h2><p class="mu">We will email a 6-digit code.</p>
      <label>Gmail</label><input id="e" type="email" value="${em}">
      <button class="btn" data-a="forgot" style="width:100%">Send code</button>
      <p class="lk mu"><a data-a="auth" data-m="login">Back</a></p>`,
    reset: `<h2>New password</h2><p class="mu">Code sent to <b>${em}</b>.</p>
      <label>6-digit code</label><input id="c" inputmode="numeric" maxlength="6"><label>New password (6+)</label><input id="p" type="password">
      <button class="btn" data-a="reset" style="width:100%">Update password</button>`
  };
  $('#app').innerHTML = `<div class="card auth">${F[AU.m]}</div>`;
}

/* ===== HOME ===== */
async function vHome() {
  $('#app').innerHTML = '<p class="mu">Loading…</p>';
  S.sets = (await api('catalog').catch(e => { toast(e); return { sets: [] }; })).sets;
  drawHome();
}
function drawHome() {
  const u = (k, f) => [...new Set(S.sets.filter(f).map(s => s[k]))];
  const cls = u('cls', () => 1); sel.cls = cls.includes(sel.cls) ? sel.cls : cls[0];
  const sub = u('subject', s => s.cls == sel.cls); sel.subject = sub.includes(sel.subject) ? sel.subject : sub[0];
  const pap = u('paper', s => s.cls == sel.cls && s.subject == sel.subject); sel.paper = pap.includes(sel.paper) ? sel.paper : pap[0];
  const ch = S.sets.filter(s => s.cls == sel.cls && s.subject == sel.subject && s.paper == sel.paper);
  sel.id = ch.some(c => c.id == sel.id) ? sel.id : (ch[0] || {}).id;
  const cur = ch.find(c => c.id == sel.id);
  const sl = (k, lab, arr) => `<div><label>${lab}</label><select data-sel="${k}">${arr.map(([v, t]) => `<option value="${esc(v)}" ${v == sel[k] ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  $('#app').innerHTML = !S.sets.length ? `<div class="card"><h2>No exams yet</h2><p class="mu">The admin has not published any questions.</p></div>` : `
    <div class="card"><h2>Choose an exam</h2><p class="mu">Class → Subject → Paper → Chapter</p>
    <div class="g4" style="margin-top:12px">${sl('cls', 'Class', cls.map(x => [x, x]))}${sl('subject', 'Subject', sub.map(x => [x, x]))}${sl('paper', 'Paper', pap.map(x => [x, x]))}${sl('id', 'Chapter', ch.map(c => [c.id, c.chapter]))}</div></div>
    ${cur ? `<div class="card row"><div><h3>${esc(cur.chapter)}</h3><div class="mu">${cur.n} questions · ${cur.mins} min · +${cur.pos} / −${cur.neg}</div>
    <span class="pill w" style="margin-top:6px">Attempt #${cur.tries + 1}</span></div><button class="btn" data-a="start">▶ Start exam</button></div>` : ''}`;
}

/* ===== EXAM ===== */
function vExam() {
  const q = E.qs;
  $('#app').innerHTML = `<div class="stick"><span style="font-size:13px">${esc(E.set.chapter)}</span><b id="tm"></b><button class="btn sm" style="background:#fff;color:var(--p)" data-a="submit">Submit</button></div>
  <div class="card"><div class="mu" style="margin-bottom:8px">Answered: <b id="cnt">0</b> / ${q.length} (yellow = answered)</div>
  <div class="pal">${q.map((_, i) => `<a id="p${i}" data-a="jump" data-i="${i}">${i + 1}</a>`).join('')}</div></div>
  ${q.map((x, i) => `<div class="q" id="q${i}"><div class="qh"><span>${esc(x.q)}</span><span class="sc">+${E.set.pos}</span></div>
  <div class="os">${x.options.map((o, k) => `<button class="o" data-a="pick" data-i="${i}" data-k="${k}"><i class="b">${L[k]}</i><span>${esc(clean(o))}</span></button>`).join('')}</div></div>`).join('')}
  <div class="card row"><span class="mu">Unanswered questions carry no penalty. Auto-submits at 00:00.</span>
  <span><button class="btn s" data-a="exit">Exit</button> <button class="btn" data-a="submit">Submit exam</button></span></div>`;
  clearInterval(timer);
  const tick = () => {
    const s = Math.max(0, Math.ceil((E.end - Date.now()) / 1000));
    $('#tm') && ($('#tm').textContent = [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':'));
    if (s <= 0) { clearInterval(timer); act.submit({}, null, true); }
  };
  tick(); timer = setInterval(tick, 500);
}

/* ===== REPORT (PDF 1 / PDF 2) ===== */
async function vReport({ id, type = 1 }) {
  const j = await api('report', { id, type });
  R = j; const m = j.meta, k = j.type === 2;
  document.title = `Q-Portal_${m.chapter}_Attempt${m.no}_PDF${j.type}`;
  const state = m.pdf2 === 'approved' ? '<span class="pill g">PDF 2 approved</span>' : m.pdf2 === 'requested' ? '<span class="pill w">PDF 2 pending admin</span>'
    : `<button class="btn s sm" data-a="reqpdf" data-id="${m.id}">Request PDF 2</button>`;
  $('#app').innerHTML = `<div class="card noprint row"><div>
    <button class="btn ${k ? 's' : ''} sm" data-a="rep" data-id="${m.id}" data-t="1">PDF 1 · Right/Wrong</button>
    <button class="btn ${k ? '' : 's'} sm" data-a="rep" data-id="${m.id}" data-t="2">PDF 2 · With answers</button> ${state}</div>
    <div><button class="btn ok sm" data-a="print">⬇ Download / Print PDF</button> <button class="btn no sm" data-a="go" data-v="home">Done</button></div></div>
  <div class="sheet report"><div class="frame"></div>
    <div class="row" style="align-items:flex-start"><div><div class="mu" style="font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.06em">${k ? 'Solution sheet (with answer key)' : 'Evaluation sheet'}</div>
    <h2>${esc(m.cls)} · ${esc(m.subject)} (${esc(m.paper)})</h2><div style="font-weight:600">${esc(m.chapter)}</div>
    <div class="mu">${esc(m.name)} · Roll ${esc(m.roll)} · ${esc(m.email)}<br>Attempt #${m.no} · ${esc(m.date)}</div></div>
    <div style="text-align:right"><div class="mu">Obtained marks</div><div class="score">${m.marks} / ${m.total}</div>
    <div class="mu">Correct ${m.correct} (+${m.correct * m.pos}) · Wrong ${m.wrong} (−${m.wrong * m.neg}) · Skipped ${m.skipped}</div></div></div>
    <div class="leg"><span><span class="pill g">ক</span> Right</span><span><span class="pill" style="background:#fee2e2;color:#991b1b">খ</span> Wrong</span>
    ${k ? '<span><span class="pill" style="background:var(--y);color:#713f12">গ</span> Correct option</span>' : ''}</div><hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
    ${j.items.map((it, i) => {
      const st = it.pick == null ? '' : it.right ? 'ok' : 'bad';
      return `<div class="q ${st}"><div class="qh"><span>${esc(it.q)}</span><span class="sc ${st}">${it.right ? '+' + m.pos : it.pick == null ? '0' : '−' + m.neg}</span></div><div class="os two">
      ${it.options.map((o, x) => { const c = it.pick === x ? (it.right ? 'g' : 'r') : (k && it.ans === x ? 'y' : '');
        return `<div class="o ${c}"><i class="b">${L[x]}</i><span>${esc(clean(o))}</span></div>`; }).join('')}</div></div>`;
    }).join('')}</div>`;
}

/* ===== HISTORY ===== */
async function vHist() {
  $('#app').innerHTML = '<p class="mu">Loading…</p>';
  const j = await api('history').catch(e => { toast(e); return { rows: [] }; });
  const adm = S.u.role === 'admin';
  $('#app').innerHTML = `<div class="card"><h2>${adm ? 'All attempts' : 'My exam history'}</h2><p class="mu">Every attempt is recorded separately.</p>
  <div class="tw"><table><tr>${adm ? '<th>User</th>' : ''}<th>Attempt</th><th>Chapter</th><th>Date</th><th>Marks</th><th>PDF 1</th><th>PDF 2</th></tr>
  ${j.rows.map(r => `<tr>${adm ? `<td>${esc(r.who)}</td>` : ''}<td><b>#${r.no}</b></td><td>${esc(r.chapter)}<div class="mu">${esc(r.subject)} · ${esc(r.paper)}</div></td><td class="mu">${esc(r.date)}</td>
  <td><b>${r.marks} / ${r.total}</b><div class="mu">✓${r.correct} ✕${r.wrong}</div></td>
  <td><button class="btn sm" data-a="rep" data-id="${r.id}" data-t="1">View</button></td>
  <td>${r.pdf2 === 'approved' || adm ? `<button class="btn sm ok" data-a="rep" data-id="${r.id}" data-t="2">View</button>` : r.pdf2 === 'requested' ? '<span class="pill w">Pending</span>' : `<button class="btn s sm" data-a="reqpdf" data-id="${r.id}" data-h="1">Request</button>`}</td></tr>`).join('') || '<tr><td colspan="7" class="mu">No attempts yet.</td></tr>'}
  </table></div></div>`;
}

/* ===== ADMIN ===== */
async function vAdmin() {
  const [p, c] = await Promise.all([api('pending'), api('catalog')]).catch(e => { toast(e); return [{ users: [], pdfs: [] }, { sets: [] }]; });
  const dl = (id, k) => `<datalist id="${id}">${[...new Set(c.sets.map(s => s[k]))].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  $('#app').innerHTML = `
  <div class="card"><h2>Publish questions</h2><p class="mu">Paste the Gemini array: <code>return [ { "q": "...", "options": [...], "ans": 0 } ]</code></p>
    <div class="g4" style="margin-top:10px"><div><label>Class</label><input id="aC" list="dC" value="HSC"></div><div><label>Subject</label><input id="aS" list="dS" value="Physics"></div>
    <div><label>Paper</label><select id="aP"><option>1st Paper</option><option>2nd Paper</option></select></div><div><label>Chapter</label><input id="aH" list="dH" placeholder="Chapter 2: Static Electricity"></div>
    <div><label>Time (minutes)</label><input id="aM" type="number" value="30"></div><div><label>Marks / correct</label><input id="aPo" type="number" step=".25" value="2"></div><div><label>Negative / wrong</label><input id="aNe" type="number" step=".05" value="0.25"></div></div>
    ${dl('dC', 'cls')}${dl('dS', 'subject')}${dl('dH', 'chapter')}
    <textarea id="aJ" placeholder='return [ { "q": "1. ...", "options": ["(a) ...","(b) ...","(c) ...","(d) ..."], "ans": 0 } ]'></textarea>
    <div class="row"><label><input type="checkbox" id="aA" style="width:auto;margin:0 6px 0 0">Append to existing chapter</label><button class="btn" data-a="save">Publish</button></div></div>
  <div class="card"><h3>PDF 2 requests (${p.pdfs.length})</h3><div class="tw"><table>${p.pdfs.map(x => `<tr><td><b>${esc(x.who)}</b><div class="mu">${esc(x.email)}</div></td><td>Attempt #${x.no} · ${x.marks}/${x.total}</td>
    <td style="text-align:right"><button class="btn ok sm" data-a="dec" data-k="pdf" data-id="${x.id}" data-y="1">Approve</button> <button class="btn no sm" data-a="dec" data-k="pdf" data-id="${x.id}">Reject</button></td></tr>`).join('') || '<tr><td class="mu">Nothing pending.</td></tr>'}</table></div></div>
  <div class="card"><h3>Registration approvals (${p.users.length})</h3><div class="tw"><table>${p.users.map(x => `<tr><td><b>${esc(x.name)}</b><div class="mu">${esc(x.email)}</div></td><td class="mu">${esc(x.cls)} · ${esc(x.roll)}</td>
    <td style="text-align:right"><button class="btn ok sm" data-a="dec" data-k="user" data-id="${x.email}" data-y="1">Approve</button> <button class="btn no sm" data-a="dec" data-k="user" data-id="${x.email}">Reject</button></td></tr>`).join('') || '<tr><td class="mu">Nothing pending.</td></tr>'}</table></div></div>`;
}

function parseQs(t) {
  t = t.trim().replace(/^return\s+/, '').replace(/;\s*$/, '');
  const i = t.indexOf('['), j = t.lastIndexOf(']');
  if (i < 0 || j < 0) throw 'No [ ... ] array found';
  t = t.slice(i, j + 1);
  let a; try { a = JSON.parse(t); } catch (e) { a = new Function('return ' + t)(); }
  if (!Array.isArray(a) || !a.length) throw 'Array is empty';
  return a;
}

/* ===== ACTIONS (event delegation) ===== */
const act = {
  go: d => go(d.v),
  logout: () => logout(),
  auth: d => vAuth(d.m),
  jump: d => $('#q' + d.i).scrollIntoView({ behavior: 'smooth', block: 'center' }),
  print: () => window.print(),
  exit: () => { if (confirm('Leave this exam? Your answers will be lost.')) { clearInterval(timer); E = null; go('home'); } },
  login: async () => {
    const j = await api('login', { email: val('e'), pass: val('p') });
    S.t = j.token; S.u = j.user; localStorage.setItem('qp_t', j.token); localStorage.setItem('qp_u', JSON.stringify(j.user)); go('home');
  },
  register: async () => {
    AU.em = val('e').trim().toLowerCase();
    await api('register', { name: val('n'), roll: val('r'), cls: val('c'), email: AU.em, pass: val('p') });
    vAuth('otp');
  },
  verify: async () => { await api('verify', { email: AU.em, code: val('c') }); toast('Verified! Waiting for admin approval.'); vAuth('login'); },
  forgot: async () => { AU.em = val('e').trim().toLowerCase(); await api('forgot', { email: AU.em }); toast('If the account exists, a code was sent.'); vAuth('reset'); },
  reset: async () => { await api('reset', { email: AU.em, code: val('c'), pass: val('p') }); toast('Password updated. Sign in now.'); vAuth('login'); },
  start: async () => {
    const j = await api('start', { id: sel.id });
    E = { ...j, ans: {}, end: Date.now() + j.sec * 1000 }; go('exam');
  },
  pick: (d) => {
    const i = +d.i, k = +d.k;
    if (E.ans[i] === k) delete E.ans[i]; else E.ans[i] = k;
    document.querySelectorAll(`#q${i} .o`).forEach((b, x) => b.classList.toggle('sel', E.ans[i] === x));
    $('#p' + i).classList.toggle('d', E.ans[i] !== undefined);
    $('#cnt').textContent = Object.keys(E.ans).length;
  },
  submit: async (d, b, auto) => {
    if (!E) return;
    const left = E.qs.length - Object.keys(E.ans).length;
    if (!auto && left && !confirm(left + ' question(s) unanswered. Submit anyway?')) return;
    clearInterval(timer);
    const id = E.set.id, ans = E.ans; E = null;
    try { const j = await api('submit', { id, ans }); toast(auto ? 'Time over — auto-submitted.' : 'Exam submitted.'); go('report', { id: j.id, type: 1 }); }
    catch (e) { toast(e); go('home'); }
  },
  rep: (d) => go('report', { id: d.id, type: +d.t }),
  reqpdf: async (d) => { await api('requestPdf', { id: d.id }); toast('Request sent to admin.'); d.h ? vHist() : go('report', { id: d.id, type: 1 }); },
  save: async () => {
    const qs = parseQs(val('aJ'));
    const j = await api('saveSet', { cls: val('aC').trim(), subject: val('aS').trim(), paper: val('aP'), chapter: val('aH').trim(),
      mins: val('aM'), pos: val('aPo'), neg: val('aNe'), append: $('#aA').checked, qs });
    toast(`Published — ${j.count} questions in this chapter.`); $('#aJ').value = '';
  },
  dec: async (d) => { await api('decide', { kind: d.k, id: d.id, yes: !!d.y }); toast('Done.'); vAdmin(); }
};

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || !act[b.dataset.a]) return;
  e.preventDefault();
  b.classList.add('busy');
  try { await act[b.dataset.a](b.dataset, b); } catch (x) { toast(typeof x === 'string' ? x : (x.message || 'Something went wrong')); }
  b.classList.remove('busy');
});
document.addEventListener('change', (e) => { if (e.target.dataset.sel) { sel[e.target.dataset.sel] = e.target.value; drawHome(); } });
window.addEventListener('beforeunload', (e) => { if (E) { e.preventDefault(); e.returnValue = ''; } });

go(S.t && S.u ? 'home' : 'auth');
</script>
</body>
</html>
